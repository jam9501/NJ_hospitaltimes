<script>
'use strict';
const data=JSON.parse(document.getElementById('hospital-data').textContent);
const el=id=>document.getElementById(id);let sortKey='rank',sortDirection=1,shown=[];
const counties=[...new Set(data.map(r=>r.county))].sort();
counties.forEach(c=>el('countyFilter').add(new Option(c+' County',c)));
function selectRows(){const terms=el('searchInput').value.toLowerCase().trim().split(/\s+/).filter(Boolean),county=el('countyFilter').value,comparison=el('comparisonFilter').value;
return data.filter(r=>{const text=[r.name,r.city,r.county].join(' ').toLowerCase();return terms.every(t=>text.includes(t))&&(!county||r.county===county)&&(!comparison||(comparison==='shorter'?r.minutes<185:r.minutes>185));}).sort((a,b)=>{let d=typeof a[sortKey]==='number'?a[sortKey]-b[sortKey]:a[sortKey].localeCompare(b[sortKey]);return d*sortDirection||a.rank-b.rank||a.name.localeCompare(b.name);});}
function render(){shown=selectRows();el('resultsText').textContent='Showing '+shown.length+' of '+data.length+' hospitals';const body=el('tableBody');body.replaceChildren();
shown.forEach(r=>{const tr=document.createElement('tr');const values=['#'+r.rank,r.name,r.minutes+' min',Math.abs(r.difference)+' min '+(r.difference<0?'shorter':r.difference>0?'longer':'same'),r.city,r.county];values.forEach((value,index)=>{const td=document.createElement('td');td.textContent=value;if(index===0)td.className='rank numeric';if(index===1)td.className='hospital';if(index===2){td.className='wait numeric';td.title=Math.floor(r.minutes/60)+' hr '+r.minutes%60+' min';const bar=document.createElement('div');bar.className='bar';bar.setAttribute('aria-hidden','true');const fill=document.createElement('span');fill.style.width=(r.minutes/307*100)+'%';bar.append(fill);td.append(bar);}if(index===3)td.className='comparison '+(r.difference<0?'shorter':'longer');tr.append(td);});body.append(tr);});
if(!shown.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.className='empty';td.textContent='No hospitals match. Try another search or reset the filters.';tr.append(td);body.append(tr);}
document.querySelectorAll('th[data-key]').forEach(th=>{if(th.dataset.key===sortKey)th.setAttribute('aria-sort',sortDirection===1?'ascending':'descending');else th.removeAttribute('aria-sort');});}
['searchInput','countyFilter','comparisonFilter'].forEach(id=>el(id).addEventListener(id==='searchInput'?'input':'change',render));
document.querySelectorAll('th[data-key]').forEach(th=>th.querySelector('button').addEventListener('click',()=>{if(sortKey===th.dataset.key)sortDirection*=-1;else{sortKey=th.dataset.key;sortDirection=1;}render();}));
el('reset').addEventListener('click',()=>{el('searchInput').value='';el('countyFilter').value='';el('comparisonFilter').value='';sortKey='rank';sortDirection=1;render();});
el('download').addEventListener('click',()=>{const rows=[['Rank','Hospital','Wait Time (Minutes)','Difference From NJ Median (Minutes)','Town','County','NJ Median (Minutes)'],...shown.map(r=>[r.rank,r.name,r.minutes,r.difference,r.city,r.county,185])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='nj_hospital_wait_times.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
render();
